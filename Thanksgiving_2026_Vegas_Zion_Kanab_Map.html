<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lễ Tạ Ơn 2026 · Las Vegas → Zion → Kanab · Bản đồ mô phỏng</title>
<style>
:root{--bg:#f8f9fa;--ink:#202124;--mute:#5f6368;--line:#e3e5e8;--d1:#1a73e8;--d2:#e8710a;--d3:#188038;--d4:#a142f4;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:380px 1fr;grid-template-rows:auto 1fr auto;height:100vh}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.1px}
header .sub{font-size:12.5px;color:var(--mute);margin-top:2px}
.tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px}
.tab i{width:10px;height:10px;border-radius:50%;background:var(--c,#5f6368);display:inline-block}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
aside{grid-row:2/4;overflow:auto;background:#fff;border-right:1px solid var(--line);padding:16px 16px 40px}
#mapwrap{position:relative;overflow:hidden;background:#f2efe9;touch-action:none;cursor:grab}
#mapwrap:active{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;pointer-events:none}
#night{position:absolute;inset:0;pointer-events:none;background:#0b1640;opacity:0;transition:opacity .4s}
footer{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.pbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:17px;display:grid;place-items:center;flex:none}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-size:13px}
#scrub{flex:1;min-width:140px;accent-color:var(--ink)}
.opt{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);user-select:none}
select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:6px}
/* pins */
.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;will-change:transform}
.drop{position:absolute;left:-15px;top:-40px;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.drop b{position:absolute;inset:0;display:grid;place-items:center;transform:rotate(45deg);color:#fff;font-size:13px;font-weight:800}
.dot{position:absolute;left:-13px;top:-13px;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--c);display:grid;place-items:center;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.lbl{position:absolute;left:16px;top:-31px;white-space:nowrap;font-size:12px;font-weight:650;color:#202124;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;pointer-events:none}
.pin.alt .lbl{left:15px;top:-10px;font-weight:600;color:#3c4043;font-size:11.5px}
.pin.hide-lbl .lbl{display:none}
.pin:hover .lbl{display:block!important;z-index:5}
.pin:hover{z-index:20}
.badge{position:absolute;left:8px;top:-48px;background:#202124;color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;border:1.5px solid #fff}
.pin.alt .badge{left:6px;top:-22px}
.city{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap;font-size:11px;color:#5f6368;text-shadow:0 0 3px #f2efe9,0 0 3px #f2efe9,0 0 2px #f2efe9;pointer-events:none}
.city.r1{font-size:13px;font-weight:700;color:#3c4043}
.city.state{font-size:14px;letter-spacing:5px;color:#9aa0a6;font-weight:600}
.city.park{font-size:11px;color:#2e6b32;font-style:italic;font-weight:600}
.city.water{font-size:11px;color:#3b7fb6;font-style:italic}
.city.tz{font-size:11px;color:#8e24aa;font-weight:700;background:#fff;border:1px solid #e1bee7;border-radius:6px;padding:1px 6px;text-shadow:none}
.shield{position:absolute;left:0;top:0;font-size:10px;font-weight:800;padding:1px 4px;border-radius:4px;white-space:nowrap;pointer-events:none;box-shadow:0 0 0 1.5px #fff}
.shield.i{background:#1d4ea3;color:#fff;border-top:3px solid #c62828}
.shield.us{background:#fff;color:#202124;border:1.5px solid #202124}
.shield.st{background:#fff;color:#202124;border:1.5px solid #6d6d6d;border-radius:9px}
.car{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:30}
.car .ring{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:rgba(26,115,232,.18);animation:pulse 1.6s infinite}
.car .body{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:var(--c,#1a73e8);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center;font-size:13px}
.car .arr{position:absolute;left:-6px;top:-27px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid var(--c,#1a73e8);transform-origin:6px 27px}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.4);opacity:0}}
/* map chrome */
.ctl{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.25);overflow:hidden;z-index:40}
.ctl button{width:38px;height:38px;border:none;background:#fff;font-size:18px;border-bottom:1px solid var(--line)}
.ctl button:last-child{border-bottom:none;font-size:14px}
.hud{position:absolute;left:12px;top:12px;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.25);padding:9px 13px;z-index:40;max-width:min(360px,calc(100% - 24px))}
.hud .k{font-size:11.5px;color:var(--mute);font-weight:600}
.hud .clock{font-size:22px;font-weight:800;letter-spacing:.3px;font-variant-numeric:tabular-nums}
.hud .clock small{font-size:11.5px;font-weight:600;color:var(--mute);margin-left:6px}
.hud .st{font-size:12.5px;margin-top:2px}
.layers{position:absolute;left:12px;bottom:14px;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.25);padding:8px 12px;z-index:40;font-size:12px}
.layers summary{cursor:pointer;font-weight:700;color:#3c4043;list-style:none}.layers summary::-webkit-details-marker{display:none}.layers[open] summary{margin-bottom:4px}
.layers label{display:flex;align-items:center;gap:6px;margin:3px 0;cursor:pointer}
.layers .lg{display:flex;gap:10px;margin-top:6px;padding-top:6px;border-top:1px solid var(--line);color:var(--mute);flex-wrap:wrap}
.layers .lg span{display:flex;align-items:center;gap:4px}
.layers .lg svg{width:26px;height:8px}
.card{position:absolute;right:12px;top:12px;width:340px;max-height:calc(100% - 24px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.3);z-index:50;cursor:default}
.card[hidden]{display:none}
.card .img{height:170px;overflow:hidden;border-radius:14px 14px 0 0;position:relative}
.card .img svg{width:100%;height:100%;display:block}
.card .x{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:15px}
.card .bd{padding:12px 15px 15px}
.card .k{font-size:11.5px;font-weight:700;color:var(--c,#5f6368);text-transform:uppercase;letter-spacing:.4px}
.card h3{margin:3px 0 8px;font-size:18px;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{font-size:11.5px;background:#f1f3f4;border-radius:999px;padding:3px 9px;color:#3c4043;font-weight:600}
.card ul{margin:0;padding-left:18px;font-size:13.2px;line-height:1.5}
.card ul li{margin:3px 0}
.near{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.near .t{font-size:11.5px;font-weight:700;color:var(--mute);margin-bottom:5px}
.near button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;margin:0 4px 5px 0}
.acts{display:flex;gap:8px;margin-top:12px}
.acts a,.acts button{flex:1;text-align:center;text-decoration:none;border-radius:8px;padding:8px;font-size:13px;font-weight:650}
.acts a{background:#1a73e8;color:#fff}
.acts button{border:1px solid var(--line);background:#fff}
/* side */
aside h2{font-size:19px;margin:4px 0 6px}
aside h3{font-size:13.5px;margin:20px 0 8px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.stat{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-size:17px}
.stat span{font-size:11px;color:var(--mute)}
.daycard{display:block;width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid var(--c);background:#fff;border-radius:12px;padding:10px 12px;margin:8px 0}
.daycard:hover{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.dc-k{font-size:11.5px;font-weight:700;color:var(--c)}
.dc-t{font-size:14.5px;font-weight:700;margin:2px 0}
.dc-m{font-size:12px;color:var(--mute)}
.thumbs{display:flex;gap:5px;margin-top:8px}
.thumbs div{flex:1;height:46px;border-radius:7px;overflow:hidden}
.thumbs svg,.th svg,.alt-b .th svg{width:100%;height:100%;display:block}
.checks{padding-left:0;list-style:none;margin:0;font-size:13px;line-height:1.45}
.checks li{padding:6px 0 6px 26px;position:relative;border-bottom:1px dashed var(--line)}
.checks li::before{content:"✓";position:absolute;left:4px;top:6px;color:#188038;font-weight:800}
.links a{display:block;font-size:12.5px;color:#1a73e8;margin:4px 0;text-decoration:none}
.fine{font-size:11.5px;color:var(--mute);line-height:1.5;margin-top:18px}
.dayhead{border-radius:14px;padding:12px 14px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff}
.dayhead .dh-k{font-size:12px;font-weight:700;opacity:.9}
.dayhead h2{color:#fff;margin:3px 0 4px}
.dayhead .dh-m{font-size:12.5px;opacity:.95}
.dh-act{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dh-act button,.dh-act a{border:none;background:#fff;color:var(--ink);border-radius:8px;padding:7px 11px;font-size:12.5px;font-weight:700;text-decoration:none}
.dh-act a{background:rgba(255,255,255,.18);color:#fff}
ol.stops{list-style:none;padding:0;margin:14px 0 0}
ol.stops li.s{display:flex;gap:10px;align-items:flex-start;padding:7px;border-radius:10px;cursor:pointer}
ol.stops li.s:hover,ol.stops li.s.on{background:#f1f3f4}
.th{width:84px;height:52px;border-radius:8px;overflow:hidden;flex:none;position:relative}
.th .n{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;border:1.5px solid #fff}
.s .tm{font-size:11.5px;color:var(--mute);font-weight:700}
.s .nm{font-size:14px;font-weight:700;line-height:1.25}
.s .sn{font-size:12px;color:var(--mute);line-height:1.35;margin-top:2px}
li.leg{font-size:11.5px;color:var(--mute);padding:1px 0 1px 46px;border-left:2px dashed var(--c);margin-left:48px;padding-left:12px;line-height:1.9}
.notes{margin:0;padding-left:18px;font-size:13px;line-height:1.5}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alt-b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:0;text-align:left;overflow:hidden}
.alt-b .th{width:100%;height:58px;border-radius:0}
.alt-b .t{padding:6px 8px 8px;font-size:12.5px;font-weight:700;line-height:1.25}
.alt-b .t small{display:block;font-weight:600;color:var(--mute);font-size:11px;margin-top:2px}
@media (max-width:880px){
 #app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto auto;height:auto}
 header{grid-column:1;grid-row:1}
 #mapwrap{grid-row:2}
 footer{grid-row:3}
 aside{grid-row:4;border-right:none;border-top:1px solid var(--line)}
 .tabs{margin-left:0}
 .card{left:8px;right:8px;width:auto;top:auto;bottom:8px;max-height:72%}
 .card .img{height:130px}
 .layers{display:none}
 .hud .clock{font-size:18px}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <div>
   <h1>🦃 Lễ Tạ Ơn 2026 · Las Vegas → Zion → Kanab</h1>
   <div class="sub">26–29/11 · 4 người · 3 đêm Airbnb ở Kanab · bản đồ mô phỏng chạy offline</div>
  </div>
  <nav class="tabs" id="tabs"></nav>
 </header>
 <aside id="side"></aside>
 <section id="mapwrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><g id="base"></g><g id="routes"></g></svg>
  <div id="night"></div>
  <div id="overlay"></div>
  <div class="hud" id="hud"></div>
  <details class="layers ctl-l" id="layers"><summary>☰ Lớp bản đồ & chú thích</summary>
   <label><input type="checkbox" id="lySee" checked> 📸 Check-in dự phòng</label>
   <label><input type="checkbox" id="lyFood" checked> 🍽️ Ăn uống dự phòng</label>
   <label><input type="checkbox" id="lyTz" checked> Ranh giới múi giờ</label>
   <div class="lg">
    <span><svg viewBox="0 0 26 8"><path d="M1 4H25" stroke="#1a73e8" stroke-width="4"/></svg>Lái xe</span>
    <span><svg viewBox="0 0 26 8"><path d="M1 4H25" stroke="#1a73e8" stroke-width="4" stroke-dasharray="6 3"/></svg>Shuttle</span>
    <span><svg viewBox="0 0 26 8"><path d="M1 4H25" stroke="#1a73e8" stroke-width="3" stroke-dasharray="1 4" stroke-linecap="round"/></svg>Đi bộ</span>
   </div>
  </details>
  <div class="ctl">
   <button id="zin" title="Phóng to">+</button>
   <button id="zout" title="Thu nhỏ">−</button>
   <button id="zfit" title="Xem cả tuyến">⤢</button>
  </div>
  <div class="card" id="card" hidden></div>
 </section>
 <footer>
  <button class="pbtn" id="play" title="Chạy / dừng (phím Space)">▶</button>
  <button class="sbtn" id="prev" title="Ngày trước">⏮</button>
  <button class="sbtn" id="next" title="Ngày sau">⏭</button>
  <input type="range" id="scrub" min="0" max="1" step="1" value="0">
  <select id="speed" title="Tốc độ"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
  <label class="opt"><input type="checkbox" id="follow" checked> Camera theo xe</label>
  <label class="opt"><input type="checkbox" id="auto" checked> Tự mở thẻ điểm dừng</label>
 </footer>
</div>

<script>
"use strict";
/* =================== projection =================== */
const K=100, LON0=-118.3, LAT0=37.8, CX=Math.cos(36.5*Math.PI/180);
const P=(lon,lat)=>[(lon-LON0)*K*CX,(LAT0-lat)*K];
const hav=(a,b)=>{const R=3958.8,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r;const s=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(s));};
const TZX=P(-114.05,0)[0];
const isEast=x=>x>TZX;

/* =================== illustrations =================== */
let gid=0;
const SKY={day:['#6fbdf2','#dff3ff'],dawn:['#2c3e74','#f6b07c'],dusk:['#2a2350','#f08a5d'],soft:['#9fd3f7','#f3faff']};
function sk(k){const [a,b]=Array.isArray(k)?k:SKY[k];const id='sk'+(++gid);return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="400" height="200" fill="url(#${id})"/>`;}
const rnd=i=>{const x=Math.sin(i*12.9898+78.233)*43758.5453;return x-Math.floor(x);};
const palm=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#2f4f3a"><path d="M-2 0 Q2 -40 0 -70 L4 -70 Q6 -40 3 0Z" fill="#5b4636"/><path d="M2 -70 q-25 -10 -40 5 q20 -14 40 -3Z"/><path d="M2 -70 q25 -12 40 4 q-20 -12 -40 -2Z"/><path d="M2 -70 q-10 -22 -30 -24 q18 4 30 22Z"/><path d="M2 -70 q12 -22 32 -22 q-20 6 -32 20Z"/></g>`;
const pine=(x,y,s=1,c='#3d6b3a')=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2" y="-6" width="4" height="8" fill="#5b4636"/><path d="M0 -40 L12 -6 H-12Z" fill="${c}"/></g>`;
const cotton=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><rect x="-2" y="-14" width="4" height="16" fill="#6b5240"/><circle cx="0" cy="-22" r="12" fill="#e9b949"/><circle cx="-8" cy="-16" r="8" fill="#d9a23a"/><circle cx="8" cy="-17" r="9" fill="#f0c95a"/></g>`;
const juniper=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="-8" rx="13" ry="10" fill="#4f6b45"/><ellipse cx="7" cy="-12" rx="8" ry="7" fill="#5f7d52"/></g>`;
const person=(x,y,c='#333')=>`<g fill="${c}"><circle cx="${x}" cy="${y-13}" r="2.7"/><rect x="${x-2.3}" y="${y-10}" width="4.6" height="10" rx="2"/></g>`;
const car=(x,y,c='#1a73e8')=>`<g transform="translate(${x} ${y})"><rect x="0" y="-10" width="56" height="13" rx="4" fill="${c}"/><path d="M10 -10 L16 -19 H38 L46 -10Z" fill="${c}"/><path d="M18 -17 H28 V-11 H14Z M30 -17 H37 L42 -11 H30Z" fill="#cfe8ff"/><circle cx="13" cy="4" r="5" fill="#222"/><circle cx="43" cy="4" r="5" fill="#222"/></g>`;
const ground=(y,c)=>`<rect y="${y}" width="400" height="${200-y}" fill="${c}"/>`;
const ridge=(c,pts)=>`<path d="M0 200 L${pts} L400 200Z" fill="${c}"/>`;

function storefronts(signs,skyk){
 const cols=['#8d5a3b','#3f6e8c','#a33c2c','#d9b26a','#6c7f4a','#7b4d6b'];
 let s=sk(skyk)+`<path d="M0 125 L40 82 L120 88 L170 70 L250 84 L320 66 L400 80 V200 H0Z" fill="#b8502f"/><path d="M0 135 L60 110 L150 118 L230 104 L320 114 L400 106 V200 H0Z" fill="#d06a43"/>`;
 let x=12;
 signs.forEach((t,i)=>{const w=58+((i*17)%22),h=48+((i*13)%26),c=cols[i%cols.length],top=160-h;
  s+=`<rect x="${x}" y="${top}" width="${w}" height="${h}" fill="${c}"/><rect x="${x-3}" y="${top-6}" width="${w+6}" height="8" fill="${c}" opacity=".85"/>`;
  s+=`<rect x="${x+6}" y="${top+20}" width="${w/2-10}" height="14" fill="#ffe7a8" opacity=".85"/><rect x="${x+w/2+4}" y="${top+20}" width="${w/2-10}" height="14" fill="#ffe7a8" opacity=".85"/><rect x="${x+w/2-7}" y="${160-20}" width="14" height="20" fill="#3b2a20"/>`;
  if(t) s+=`<rect x="${x+5}" y="${top+4}" width="${w-10}" height="12" fill="#f5ead2"/><text x="${x+w/2}" y="${top+13.5}" font-size="8.5" font-weight="800" text-anchor="middle" fill="#3b2a20" font-family="Georgia,serif">${t}</text>`;
  x+=w+8;});
 s+=`<rect y="160" width="400" height="40" fill="#8a8178"/><rect y="158" width="400" height="5" fill="#c9bfae"/>`;
 return s;
}

function food(kind){

 for(const L of labelEls){let show;if(L.cls==='state')show=w>120;else if(L.rank===0)show=true;else show=L.rank===1||(L.rank===2&&w<330)||(L.rank===3&&w<90);

 for(const Sh of shieldEls){const show=(Sh.rank===1&&w<900)||(Sh.rank===2&&w<300)||(Sh.rank===3&&w<70);Sh.e.style.display=show?'':'none';if(show){const s=scr(Sh.m);Sh.e.style.transform=`translate(${s[0].toFixed(1)}px,${s[1].toFixed(1)}px)`;}}
